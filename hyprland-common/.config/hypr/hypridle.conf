general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = $HOME/.config/hypr/scripts/idle-dim.sh dim      # dim backlight, but never raise it.
    on-resume = $HOME/.config/hypr/scripts/idle-dim.sh restore   # restore only if we actually dimmed.
}

# No keyboard-backlight listener: on the Framework 16 the keyboard backlight is
# EC-controlled with no /sys/class/leds entry, so brightnessctl cannot see it
# ("Device 'rgb:kbd_backlight' not found"). Every route to it needs root —
# framework_tool reads root-only SMBIOS tables, ectool needs /dev/cros_ec, and
# the keyboard's hidraw nodes are root-only too. Granting uaccess on /dev/cros_ec
# or a NOPASSWD sudoers entry is a poor trade for a cosmetic idle behaviour, and
# this listener was silently doing nothing for months without being missed.

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = hyprctl dispatch dpms off                            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && $HOME/.config/hypr/scripts/idle-dim.sh restore   # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}