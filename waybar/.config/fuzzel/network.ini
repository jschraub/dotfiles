# network.ini -- fuzzel theme for the waybar network menu (network-menu.sh).
#
# Deliberately a separate config from any general-purpose fuzzel launcher: this
# one is anchored under the bar rather than centred, and is sized for the menu's
# fixed-width columns. network-menu.sh passes it with --config.
#
# Catppuccin Mocha, matching wofi/.config/wofi/style.css. The border is @yellow
# rather than wofi's @peach on purpose -- it is the same colour as the waybar
# network module (see #network in waybar's style.css), so the popup reads as
# belonging to the icon that spawned it.

[main]
font=CaskaydiaCove Nerd Font:size=13

# eDP-2 is a 16" 2560x1600 panel, i.e. ~189 DPI, and Hyprland runs it at
# scale 1.0. fuzzel's default (dpi-aware=auto) sizes fonts from the real
# monitor DPI whenever the scale factor is 1, which would render size=13 at
# roughly 34px -- about double everything else. waybar (16px) and wofi (18px)
# both size in pixels at scale 1, so match them: with dpi-aware=no the font is
# sized off the scaling factor instead, putting 13pt at ~17px.
dpi-aware=no

# Sit flush under the right-hand end of the bar. y-margin is waybar's height:
# `hyprctl -j monitors` reports a 39px top reservation on eDP-2.
anchor=top-right
x-margin=8
y-margin=39

# width is in CHARACTERS, not pixels. The widest row is roughly
#   <icon>  <22-char ssid>  <4 bars>  <security>
# and the security field can reach "WPA2 802.1X", so 48 leaves a little slack.
width=48
lines=14

horizontal-pad=16
vertical-pad=12
inner-pad=8

# network-menu.sh emits rows in a deliberate order (current network, then saved
# by signal, then unsaved by signal). Never re-sort them.
sort-result=no

# Mirrors wofi/.config/wofi/style.css so the two menus read as one system:
# @peach for the window border and matched characters, @maroon for the input
# accent and the selected row's text, @base/@text for the body.
#
# wofi draws its selected entry as a peach *outline* with maroon text rather
# than a filled bar. fuzzel has no per-entry border, so the closest equivalent
# is a subtle @surface0 fill carrying the same maroon text.
[colors]
background=1e1e2eff
text=cdd6f4ff
match=fab387ff
selection=313244ff
selection-text=eba0acff
selection-match=fab387ff
border=fab387ff
input=cdd6f4ff
prompt=eba0acff
placeholder=6c7086ff

[border]
width=2
radius=8
